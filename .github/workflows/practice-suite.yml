name: Practice suite

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * *'
    - cron: '0 4 * * 0'
  workflow_dispatch:

jobs:
  bank-demo:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: practice-suite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            practice-suite/package-lock.json
      - name: Install root (eslint)
        run: npm ci
        working-directory: .
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=bank-demo --project=setup --project=bank-demo-authed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bank-demo-json-report
          path: practice-suite/test-results/report.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Flake summary (non-blocking)
        if: always()
        continue-on-error: true
        working-directory: .
        run: node tools/flake-report.mjs practice-suite/test-results/report.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: bank-demo-report
          path: |
            practice-suite/playwright-report
            practice-suite/test-results
          retention-days: 7

  cross-browser-weekly:
    if: github.event_name == 'schedule' && github.event.schedule == '0 4 * * 0' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: practice-suite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: practice-suite/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps firefox webkit
      - run: npx playwright test --project=firefox-bank-demo --project=webkit-bank-demo
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cross-browser-report
          path: |
            practice-suite/playwright-report
            practice-suite/test-results
          retention-days: 7

  external-nightly:
    if: github.event_name == 'schedule' && github.event.schedule == '0 3 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    defaults:
      run:
        working-directory: practice-suite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: practice-suite/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium-external --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-blob-${{ matrix.shardIndex }}
          path: practice-suite/blob-report
          retention-days: 5

  merge-external-report:
    needs: external-nightly
    if: always() && (github.event_name == 'schedule' && github.event.schedule == '0 3 * * *' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: practice-suite/package-lock.json
      - run: npm ci
        working-directory: practice-suite
      - uses: actions/download-artifact@v4
        with:
          pattern: external-blob-*
          path: practice-suite/all-blob-reports
          merge-multiple: true
      - name: Merge blob reports
        working-directory: practice-suite
        run: npx playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@v4
        with:
          name: external-html-report
          path: practice-suite/playwright-report
          retention-days: 7
